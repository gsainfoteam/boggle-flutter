# pubspec.yaml (수정된 버전)

name: boggle_flutter
description: boggle_flutter

publish_to: "none"

version: 4.3.4

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  get_it: ^8.0.2
  injectable: ^2.4.4
  flutter_svg: ^2.0.10+1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.4
  flutter_bloc: ^8.1.6
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  auto_route: ^9.2.2
  lottie: ^3.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.4.1
  build_runner: ^2.4.12
  flutter_gen_runner: ^5.7.0
  retrofit_generator: ^9.1.2
  json_serializable: ^6.8.0
  freezed: ^2.5.7
  hive_generator: ^2.0.1
  auto_route_generator: ^9.0.0

flutter_gen:
  output: lib/gen/
  line_length: 80

  integrations:
    image: true
    flutter_svg: true
    rive: true
    lottie: true

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/fonts/
    - assets/images/
